{% extends "base.html" %}
{% block content %}
<h1>Change master password</h1>
{% if request.query_params.get("changed") %}<p class="success">Master password changed.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/settings/password" class="card">
  <input type="hidden" name="csrf_token" value="{{ request.state.session.csrf_token }}">
  <label>Current master password
    <input type="password" name="current_password" required maxlength="1024" autocomplete="current-password">
  </label>
  <label>New master password
    <input type="password" name="new_password" required minlength="12" maxlength="1024" autocomplete="new-password">
  </label>
  <label>Repeat new master password
    <input type="password" name="confirm" required minlength="12" maxlength="1024" autocomplete="new-password">
  </label>
  <p class="muted">All your entries are encrypted again with the new password. Sessions are logged out.</p>
  <button type="submit">Change password</button>
</form>
{% endblock %}
