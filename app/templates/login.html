{% extends "base.html" %}
{% block content %}
<h1>Log in</h1>
{% if request.query_params.get("registered") %}<p class="success">Account created. You can log in now.</p>{% endif %}
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="card">
  <input type="hidden" name="csrf_token" value="{{ request.state.session.csrf_token }}">
  <label>Username
    <input name="username" value="{{ username }}" required maxlength="32" autocomplete="username">
  </label>
  <label>Master password
    <input type="password" name="password" required maxlength="1024" autocomplete="current-password">
  </label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
