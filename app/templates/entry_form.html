{% extends "base.html" %}
{% block content %}
<h1>{{ heading }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="{{ action }}" class="card">
  <input type="hidden" name="csrf_token" value="{{ request.state.session.csrf_token }}">
  <label>Title
    <input name="title" value="{{ values.title }}" required maxlength="200">
  </label>
  <label>URL
    <input type="url" name="url" value="{{ values.url }}" maxlength="2048" placeholder="https://">
  </label>
  <label>Username
    <input name="username" value="{{ values.username }}" maxlength="200" autocomplete="off">
  </label>
  <label>Password
    <input type="password" name="password" value="{{ values.password }}" maxlength="1024" autocomplete="new-password">
  </label>
  <label>Notes
    <textarea name="notes" rows="4" maxlength="5000">{{ values.notes }}</textarea>
  </label>
  <button type="submit">Save</button>
</form>
<p><a href="/vault">Back to vault</a></p>
{% endblock %}
