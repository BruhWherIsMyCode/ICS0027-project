{% extends "base.html" %}
{% block content %}
<h1>Two-factor code</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/login/mfa" class="card">
  <input type="hidden" name="csrf_token" value="{{ request.state.session.csrf_token }}">
  <label>6-digit code from your authenticator app
    <input name="code" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
  </label>
  <button type="submit">Verify</button>
</form>
{% endblock %}
